{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account | Brain</title>

    <link
        rel="stylesheet"
        href="{% static 'brain/css/register.css' %}"
    >

</head>

<body>

<div class="register-container">

    <div class="register-box">

        <div class="brand">
            🧠
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your Brain account
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                id="registerButton">

                Create Account

            </button>


            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite">
            </div>

        </form>


        <div class="login">

            Already have an account?

            <a href="/login/">
                Login
            </a>

        </div>

    </div>

</div>


<script
    src="{% static 'brain/js/register.js' %}">
</script>

</body>

</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brain — Sign In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #05070b;
            color: #ffffff;
            overflow: hidden;
        }

        /* Background */
        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(70, 100, 255, 0.16), transparent 32%),
                radial-gradient(circle at 80% 70%, rgba(0, 210, 255, 0.12), transparent 30%),
                #05070b;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: float 10s ease-in-out infinite;
        }

        .orb.one {
            width: 280px;
            height: 280px;
            background: #315cff;
            top: -100px;
            left: -80px;
        }

        .orb.two {
            width: 330px;
            height: 330px;
            background: #00c8ff;
            right: -130px;
            bottom: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(35px, -25px);
            }
        }

        /* Layout */
        .page {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 42px;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 28px;

            background: rgba(13, 17, 27, 0.72);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 100px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.05);

            animation: cardIn 0.7s ease;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Logo */
        .brand {
            text-align: center;
            margin-bottom: 34px;
        }

        .brain-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(135deg, #315cff, #00c8ff);

            box-shadow:
                0 0 40px rgba(49,92,255,0.35);

            font-size: 31px;

            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 30px rgba(49,92,255,0.25);
            }

            50% {
                box-shadow: 0 0 55px rgba(0,200,255,0.35);
            }
        }

        .brand h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .brand p {
            margin-top: 8px;
            color: #8e98ab;
            font-size: 14px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #cbd2df;
            font-size: 14px;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 54px;
            padding: 0 16px;

            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 14px;

            background: rgba(255,255,255,0.045);
            color: #ffffff;

            outline: none;
            font-size: 15px;

            transition: 0.25s ease;
        }

        input::placeholder {
            color: #626b7b;
        }

        input:focus {
            border-color: rgba(74,120,255,0.8);

            box-shadow:
                0 0 0 4px rgba(49,92,255,0.10),
                0 0 25px rgba(49,92,255,0.08);

            background: rgba(255,255,255,0.065);
        }

        .password-input {
            padding-right: 54px;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: none;
            color: #788397;

            cursor: pointer;
            font-size: 18px;

            transition: 0.2s;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        /* Error */
        .error {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;

            border: 1px solid rgba(255,80,80,0.2);
            border-radius: 12px;

            background: rgba(255,60,60,0.08);
            color: #ff8e8e;

            font-size: 13px;
        }

        /* Button */
        .login-button {
            width: 100%;
            height: 55px;
            margin-top: 8px;

            border: none;
            border-radius: 14px;

            background: linear-gradient(135deg, #315cff, #167dff);

            color: #ffffff;
            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 12px 30px rgba(49,92,255,0.25);

            transition: 0.25s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 16px 38px rgba(49,92,255,0.38);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button.loading {
            opacity: 0.7;
            cursor: wait;
        }

        /* Register */
        .register {
            margin-top: 25px;
            text-align: center;

            color: #737e91;
            font-size: 14px;
        }

        .register a {
            color: #72a0ff;
            text-decoration: none;
            font-weight: 500;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: #4e5869;
            font-size: 11px;
        }

        /* Mobile */
        @media (max-width: 500px) {
            .login-card {
                padding: 30px 22px;
                border-radius: 23px;
            }

            .brand h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<main class="page">

    <section class="login-card">

        <div class="brand">
            <div class="brain-icon">🧠</div>

            <h1>Welcome to Brain</h1>

            <p>Your intelligent workspace starts here.</p>
        </div>

        <div id="errorBox" class="error"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >
                        ◉
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Sign in to Brain
            </button>

        </form>

        <div class="register">
            Don't have an account?
           <a href="/register/">Create account</a>
        </div>

        <div class="footer">
            Brain • Intelligent system
        </div>

    </section>

</main>

<script>
    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const errorBox = document.getElementById("errorBox");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";

        togglePassword.textContent = isPassword ? "◉" : "◌";
    });

    loginForm.addEventListener("submit", async (event) => {

        event.preventDefault();

        errorBox.style.display = "none";

        loginButton.classList.add("loading");
        loginButton.textContent = "Signing in...";

        try {

            const response = await fetch("/api/auth/login/", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "same-origin",

                body: JSON.stringify({
                    email: emailInput.value.trim(),
                    password: passwordInput.value
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Email or password is incorrect."
                );
            }

            loginButton.textContent = "Welcome back ✓";

            setTimeout(() => {
                window.location.href = "/";
            }, 500);

        } catch (error) {

            errorBox.textContent = error.message;
            errorBox.style.display = "block";

            loginButton.classList.remove("loading");
            loginButton.textContent = "Sign in to Brain";
        }
    });
</script>

</body>
</html>

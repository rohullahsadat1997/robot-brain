{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brain — Sign In</title>

    <link rel="stylesheet" href="{% static 'brain/css/login.css' %}">
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<main class="page">

    <section class="login-card">

        <div class="brand">

            <div class="brain-icon">🧠</div>

            <h1>Welcome to Brain</h1>

            <p>Your intelligent workspace starts here.</p>

        </div>

        <div id="errorBox" class="error"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="password-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        ◉
                    </button>

                </div>

            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Sign in to Brain
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="/register/">Create account</a>
        </div>

        <div class="footer">
            Brain • Intelligent system
        </div>

    </section>

</main>

<script src="{% static 'brain/js/login.js' %}"></script>

</body>
</html>
